<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title description">
  <title id="title">Alozie C. Nwachukwu / ACENWA</title>
  <desc id="description">Cyan and violet circuit traces frame the developer name and the principles build, secure, automate, evolve.</desc>
  <style>

    @keyframes route-flow { to { stroke-dashoffset: -408; } }
    @keyframes node-glow { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: no-preference) {
      .signal-route { animation: route-flow 10s linear infinite; }
      .signal-node { animation: node-glow 4s ease-in-out infinite; }
      .signal-node:nth-child(2) { animation-delay: -2s; }
    }
</style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#040a13" />
      <stop offset="1" stop-color="#0b1b30" />
    </linearGradient>
    <linearGradient id="spectrum" x2="1" y2=".5">
      <stop stop-color="#22e4f4" />
      <stop offset=".55" stop-color="#39a9fc" />
      <stop offset="1" stop-color="#a28aff" />
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#1598bd" stop-opacity=".22" />
      <stop offset="1" stop-color="#1598bd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sphere" cx=".3" cy=".2">
      <stop stop-color="#103b55" />
      <stop offset="1" stop-color="#061222" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#276080" stroke-width=".5" opacity=".22" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <path d="M18 1H1182L1199 18V102L1182 119H18L1 102V18Z" fill="url(#background)" stroke="#21455f" />
  <path d="M1 38V18L18 1H153M1047 119H1182L1199 102V82" fill="none" stroke="#55dbea" stroke-width="1.4" />
  <path d="M687 29H760L783 52H954L970 36H1149M750 84H844L860 68H1149" fill="none" stroke="url(#spectrum)" stroke-width=".8" opacity=".6" />
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="39" y="48" fill="#c4ebf4" font-size="18" letter-spacing="1.5">ALOZIE C. NWACHUKWU</text>
    <text x="39" y="81" fill="#60c8dc" font-size="10" letter-spacing="2.2">BUILD // SECURE // AUTOMATE // EVOLVE</text>
    <text x="1010" y="101" fill="#688da8" font-size="9" letter-spacing="2">@ACENWA</text>
  </g>
  <g fill="#6ce1e9">
    <circle cx="783" cy="52" r="2" class="signal-node" />
    <circle cx="970" cy="36" r="2" class="signal-node" />
    <circle cx="1149" cy="68" r="2" class="signal-node" />
  </g>
  <path d="M687 29H760L783 52H954L970 36H1149M750 84H844L860 68H1149" fill="none" stroke="#75e8ef" stroke-width="1.5" stroke-dasharray="24 180" class="signal-route" />
</svg>
