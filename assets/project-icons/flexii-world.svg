<svg xmlns="http://www.w3.org/2000/svg" width="260" height="292" viewBox="0 0 260 292" role="img" aria-labelledby="title description">
  <title id="title">FLEXII WORLD project gateway</title>
  <desc id="description">An original galactic trading emblem: a planet with latitude and longitude lines, two orbital navigation tracks, a small spacecraft, constellations, and a data trace.</desc>
  <style>

    @keyframes ring-drift { to { transform: rotate(360deg); } }
    @keyframes core-glow { 50% { opacity: .85; } }
    @keyframes orbit-signal { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: no-preference) {
      .icon-ring { transform-origin: 130px 124px; animation: ring-drift 36s linear infinite; }
      .icon-halo { animation: core-glow 5s ease-in-out infinite; }
      .wave-glow { animation: core-glow 2.8s ease-in-out infinite; }
      .visor-glow { animation: core-glow 4s ease-in-out infinite; }
      .orbit-trace { animation: orbit-signal 12s linear infinite; }
    }
</style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#040a13" />
      <stop offset="1" stop-color="#0b1b30" />
    </linearGradient>
    <linearGradient id="spectrum" x2="1" y2=".5">
      <stop stop-color="#22e4f4" />
      <stop offset=".55" stop-color="#39a9fc" />
      <stop offset="1" stop-color="#a28aff" />
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#1598bd" stop-opacity=".22" />
      <stop offset="1" stop-color="#1598bd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sphere" cx=".3" cy=".2">
      <stop stop-color="#103b55" />
      <stop offset="1" stop-color="#061222" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#276080" stroke-width=".5" opacity=".22" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <clipPath id="planet-clip">
      <circle cx="128" cy="125" r="49" />
    </clipPath>
  </defs>
