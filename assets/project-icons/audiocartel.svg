<svg xmlns="http://www.w3.org/2000/svg" width="260" height="292" viewBox="0 0 260 292" role="img" aria-labelledby="title description">
  <title id="title">AUDIO CARTEL project gateway</title>
  <desc id="description">An original music and Web3 emblem: a luminous waveform inside a hexagonal audio core, surrounded by radial grooves, circuit paths, and three connected blockchain nodes.</desc>
  <style>

    @keyframes ring-drift { to { transform: rotate(360deg); } }
    @keyframes core-glow { 50% { opacity: .85; } }
    @keyframes orbit-signal { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: no-preference) {
      .icon-ring { transform-origin: 130px 124px; animation: ring-drift 36s linear infinite; }
      .icon-halo { animation: core-glow 5s ease-in-out infinite; }
      .wave-glow { animation: core-glow 2.8s ease-in-out infinite; }
      .visor-glow { animation: core-glow 4s ease-in-out infinite; }
      .orbit-trace { animation: orbit-signal 12s linear infinite; }
    }
</style>
  <defs>
